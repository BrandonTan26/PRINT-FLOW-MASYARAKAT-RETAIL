<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRINTFLOW STUDIO - Promo Label Generator</title>
<style>
:root{
  --bg-primary:#ffffff;--bg-secondary:#f3f4f6;--bg-card:#ffffff;
  --text-primary:#111827;--text-secondary:#6b7280;--border-color:#e5e7eb;
  --accent-color:#2563eb;--accent-hover:#1d4ed8;
  --success-color:#10b981;--danger-color:#ef4444;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.05);--shadow-md:0 4px 6px rgba(0,0,0,0.1);
  --radius:8px;--sidebar-width:280px;--topbar-height:60px;
}
[data-theme="dark"]{
  --bg-primary:#111827;--bg-secondary:#1f2937;--bg-card:#1f2937;
  --text-primary:#f9fafb;--text-secondary:#9ca3af;--border-color:#374151;
  --accent-color:#3b82f6;--accent-hover:#2563eb;
}
[data-theme="neon"]{
  --bg-primary:#0f0518;--bg-secondary:#1a0b2e;--bg-card:#1a0b2e;
  --text-primary:#ffffff;--text-secondary:#e9d5ff;--border-color:#7c3aed;
  --accent-color:#a855f7;--accent-hover:#9333ea;
  --shadow-md:0 0 20px rgba(168,85,247,0.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-secondary);color:var(--text-primary);line-height:1.5}
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-width);background:var(--bg-card);border-right:1px solid var(--border-color);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:50;transition:transform 0.3s ease}
.sidebar.closed{transform:translateX(-100%)}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border-color);text-align:center;position:relative}
.sidebar-close-btn{position:absolute;top:10px;right:10px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-secondary);padding:5px}
.sidebar-close-btn:hover{color:var(--text-primary)}
.sidebar-brand{font-weight:900;font-size:1.5rem;color:var(--accent-color);margin-bottom:4px}
.sidebar-version{font-size:.75rem;color:var(--text-secondary);font-weight:600}
.sidebar-menu{flex:1;overflow-y:auto;padding:16px 12px}
.menu-item{display:flex;align-items:center;padding:12px;border-radius:var(--radius);color:var(--text-secondary);text-decoration:none;margin-bottom:4px;transition:all .2s;cursor:pointer}
.menu-item:hover{background:var(--bg-secondary);color:var(--text-primary)}
.menu-item.active{background:var(--accent-color);color:white}
.menu-item svg{margin-right:12px;width:20px;height:20px}
.sidebar-footer{padding:16px;border-top:1px solid var(--border-color);font-size:.75rem;color:var(--text-secondary);text-align:center}
.main-wrapper{flex:1;margin-left:var(--sidebar-width);display:flex;flex-direction:column;transition:margin-left 0.3s ease}
.main-wrapper.sidebar-closed{margin-left:0}
.topbar{height:var(--topbar-height);background:var(--bg-card);border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-title{font-weight:700;font-size:1.1rem}
.breadcrumb{font-size:.85rem;color:var(--text-secondary)}
.icon-btn{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.icon-btn:hover{background:var(--bg-secondary);color:var(--text-primary)}
.content-area{flex:1;padding:24px;overflow-y:auto;display:flex;gap:24px;justify-content:center}
.content-main{flex:1;max-width:900px;min-width:0;min-height:0}
.content-preview{width:340px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:20px;position:sticky;top:84px;height:fit-content}
.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-color)}
.card-title{font-weight:700;font-size:1rem}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:var(--text-primary)}
.required{color:var(--danger-color)}
.form-control{width:100%;padding:10px 12px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg-primary);color:var(--text-primary);font-size:.95rem;transition:border-color .2s}
.form-control:focus{outline:none;border-color:var(--accent-color)}
.form-control.error{border-color:var(--danger-color);box-shadow:0 0 0 3px rgba(239,68,68,.1)}
.error-msg{color:var(--danger-color);font-size:.75rem;margin-top:4px;display:none}
.form-control.error~.error-msg{display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{padding:10px 20px;border-radius:var(--radius);border:none;font-weight:600;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
.btn-primary{background:var(--accent-color);color:white}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border-color)}
.btn-secondary:hover{background:var(--border-color)}
.btn-sm{padding:6px 12px;font-size:.85rem}
.btn-lg{padding:14px 28px;font-size:1rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:20px;text-align:center}
.stat-value{font-size:2rem;font-weight:800;margin-top:8px}
.stat-label{font-size:.85rem;color:var(--text-secondary)}
.toast-container{position:fixed;top:80px;right:24px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg-card);border-left:4px solid var(--success-color);padding:12px 20px;border-radius:var(--radius);box-shadow:var(--shadow-md);animation:slideIn .3s;font-size:.9rem}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:var(--bg-card);border-radius:12px;width:90%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-header{padding:20px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.modal-footer{padding:20px;border-top:1px solid var(--border-color);display:flex;justify-content:flex-end;gap:12px}
.footer-content{text-align:center;padding:24px;border-top:1px solid var(--border-color);margin-top:auto}
.footer-brand{font-weight:700;color:var(--accent-color);margin-bottom:8px}
.footer-links a{color:var(--accent-color);text-decoration:none}
.footer-links a:hover{text-decoration:underline}
.whatsapp-btn{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:white;padding:10px 20px;border-radius:var(--radius);text-decoration:none;font-weight:600;margin-top:12px;transition:opacity .2s}
.whatsapp-btn:hover{opacity:.9;text-decoration:none}
.hidden{display:none !important}
.text-center{text-align:center}
.flex{display:flex}
.gap-2{gap:8px}
.justify-between{justify-content:space-between}
.items-center{align-items:center}
.preview-wrapper{display:flex;justify-content:center;align-items:flex-start;width:100%}

@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%;margin:0;padding:0;background:white;color:black;z-index:9999}
  .sidebar,.topbar,.content-preview,.toast-container,.modal-overlay,.footer-content{display:none !important}
  .main-wrapper{margin-left:0}
  @page{margin:0;size:auto}
}
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%);width:280px}
  .sidebar.mobile-open{transform:translateX(0)}
  .main-wrapper{margin-left:0}
  .content-area{flex-direction:column}
  .content-preview{width:100%;position:static}
  .form-row{grid-template-columns:1fr}
}
</style>

<script>
const DB_NAME='PrintFlowDB';
const DB_VERSION=2;
let db,currentDoc={},appSettings={};

const PROMO_BADGES=[
  {id:'none',label:'Tanpa Badge'},
  {id:'serba-gratis',label:'SERBA GRATIS'},
  {id:'beli1gratis1',label:'BELI 1 GRATIS 1'},
  {id:'beli2gratis1',label:'BELI 2 GRATIS 1'},
  {id:'beli2murah',label:'BELI 2 LEBIH MURAH'},
  {id:'promo-spesial',label:'PROMO SPESIAL'},
  {id:'harga-spesial',label:'HARGA SPESIAL'},
  {id:'promo-mingguan',label:'PROMO SPESIAL MINGGUAN'},
  {id:'tebus-murah',label:'PROMO TEBUS MURAH'},
  {id:'custom',label:'Input Manual'}
];

const PRINTER_OPTIONS=[
  {id:'thermal-80',label:'Thermal 80mm',width:'80mm'},
  {id:'thermal-110',label:'Thermal 110mm',width:'110mm'},
  {id:'a4',label:'A4',width:'210mm'},
  {id:'a5',label:'A5',width:'148mm'},
  {id:'letter',label:'Letter',width:'215.9mm'},
  {id:'legal',label:'Legal',width:'215.9mm'}
];

const FONT_OPTIONS=[
  {id:'Arial',label:'Arial'},
  {id:'Helvetica',label:'Helvetica'},
  {id:'Times New Roman',label:'Times New Roman'},
  {id:'Georgia',label:'Georgia'},
  {id:'Verdana',label:'Verdana'},
  {id:'Courier New',label:'Courier New'}
];

const FONT_WEIGHT_OPTIONS=[
  {id:'400',label:'Normal'},
  {id:'600',label:'Semi Bold'},
  {id:'700',label:'Bold'},
  {id:'900',label:'Extra Bold'}
];

async function initDB(){
  return new Promise((resolve,reject)=>{
    const deleteRequest = indexedDB.deleteDatabase(DB_NAME);
    deleteRequest.onsuccess = () => {
      console.log('Database lama dihapus untuk reset');
    };
    deleteRequest.onerror = () => {
      console.log('Tidak ada database lama atau error menghapus');
    };
    deleteRequest.onblocked = () => {
      console.log('Database sedang digunakan, tunggu...');
    };

    setTimeout(() => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      
      request.onupgradeneeded = (event) => {
        const database = event.target.result;
        console.log('Upgrading database...');
        
        const stores = database.objectStoreNames;
        for (let i = 0; i < stores.length; i++) {
          database.deleteObjectStore(stores[i]);
        }
        
        if (!database.objectStoreNames.contains('docs')) {
          database.createObjectStore('docs', { keyPath: 'id' });
          console.log('Object store "docs" dibuat');
        }
        if (!database.objectStoreNames.contains('queue')) {
          database.createObjectStore('queue', { keyPath: 'id' });
          console.log('Object store "queue" dibuat');
        }
        if (!database.objectStoreNames.contains('history')) {
          database.createObjectStore('history', { keyPath: 'id' });
          console.log('Object store "history" dibuat');
        }
        if (!database.objectStoreNames.contains('settings')) {
          database.createObjectStore('settings', { keyPath: 'id' });
          console.log('Object store "settings" dibuat');
        }
      };
      
      request.onsuccess = (event) => {
        db = event.target.result;
        console.log('Database berhasil dibuka');
        resolve(db);
      };
      
      request.onerror = (event) => {
        console.error('Error membuka database:', event.target.error);
        reject(new Error('Gagal membuka database: ' + event.target.error.message));
      };
      
      request.onblocked = (event) => {
        console.error('Database blocked. Tutup tab lain yang menggunakan aplikasi ini.');
        reject(new Error('Database sedang digunakan. Silakan refresh halaman.'));
      };
    }, 500);
  });
}

function dbOp(store,mode,cb){
  return new Promise((res,rej)=>{
    if(!db){
      rej(new Error('Database belum terinisialisasi'));
      return;
    }
    try{
      const tx=db.transaction(store,mode);
      const r=cb(tx.objectStore(store));
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
      tx.onerror = (e) => rej(e.target.error);
    }catch(err){
      rej(err);
    }
  });
}

async function save(s,d){
  try{
    await dbOp(s,'readwrite',st=>st.put(d));
  }catch(err){
    console.error('Error saving to', s, ':', err);
    throw err;
  }
}

async function get(s,id){
  try{
    return await dbOp(s,'readonly',st=>st.get(id));
  }catch(err){
    console.error('Error getting from', s, ':', err);
    throw err;
  }
}

async function getAll(s){
  try{
    return await dbOp(s,'readonly',st=>st.getAll());
  }catch(err){
    console.error('Error getting all from', s, ':', err);
    return [];
  }
}

async function del(s,id){
  try{
    await dbOp(s,'readwrite',st=>st.delete(id));
  }catch(err){
    console.error('Error deleting from', s, ':', err);
    throw err;
  }
}

async function loadSettings(){
  try{
    const s=await get('settings','app');
    appSettings=s||{printerType:'thermal-80',fontFamily:'Arial',fontWeight:'900'};
  }catch(err){
    console.error('Error loading settings:', err);
    appSettings={printerType:'thermal-80',fontFamily:'Arial',fontWeight:'900'};
  }
}

function navigateTo(page){
  document.querySelectorAll('.menu-item').forEach(e=>e.classList.remove('active'));
  const el=document.querySelector(`.menu-item[data-page="${page}"]`);
  if(el)el.classList.add('active');
  const titles={create:'Buat Promo',queue:'Antrian Print',history:'Riwayat',settings:'Pengaturan'};
  document.getElementById('page-title').textContent=titles[page]||'Buat Promo';
  document.getElementById('breadcrumb').textContent=titles[page]||'Buat Promo';
  renderPage(page);
}

function toggleSidebar(){
  const sidebar=document.getElementById('sidebar');
  const mainWrapper=document.getElementById('main-wrapper');
  sidebar.classList.toggle('closed');
  mainWrapper.classList.toggle('sidebar-closed');
}

function toggleTheme(){
  const d=document.documentElement;
  const t=d.getAttribute('data-theme');
  d.setAttribute('data-theme',t==='light'?'dark':t==='dark'?'neon':'light');
}

function showToast(msg,type='success'){
  const c=document.getElementById('toast-container');
  const t=document.createElement('div');
  t.className='toast';
  t.style.borderLeftColor=type==='error'?'var(--danger-color)':'var(--success-color)';
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

function openModal(title,content,onConfirm){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=content;
  document.getElementById('modal-overlay').classList.add('active');
  document.getElementById('modal-confirm-btn').onclick=()=>{if(onConfirm)onConfirm();closeModal()};
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('active')}

async function renderPage(page){
  const m=document.getElementById('main-content');
  m.innerHTML='';
  if(page==='create'){
    renderCreatePage(m);
  }else if(page==='queue'){
    renderQueuePage(m);
  }else if(page==='history'){
    renderHistoryPage(m);
  }else if(page==='settings'){
    renderSettingsPage(m);
  }else{
    renderCreatePage(m);
  }
}

function onBadgeChange(){
  const val=document.getElementById('f-promo-badge').value;
  const customGroup=document.getElementById('custom-badge-group');
  if(customGroup)customGroup.classList.toggle('hidden',val!=='custom');
  updatePreview();
}

function formatPeriod(start,end){
  if(!start||!end)return'';
  const s=new Date(start),e=new Date(end);
  const months=['JANUARI','FEBRUARI','MARET','APRIL','MEI','JUNI','JULI','AGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DESEMBER'];
  if(s.getMonth()===e.getMonth()&&s.getFullYear()===e.getFullYear()){
    return`PERIODE ${s.getDate()} - ${e.getDate()} ${months[e.getMonth()]} ${e.getFullYear()}`;
  }
  return`PERIODE ${s.getDate()} ${months[s.getMonth()]} - ${e.getDate()} ${months[e.getMonth()]} ${e.getFullYear()}`;
}

function getBadgeText(doc){
  if(doc.promoBadge==='custom')return doc.customBadge||'';
  if(doc.promoBadge==='none')return'';
  const b=PROMO_BADGES.find(x=>x.id===doc.promoBadge);
  return b?b.label:'';
}

function buildLabelHTML(doc,forPrint=false){
  const badgeText=getBadgeText(doc);
  const period=formatPeriod(doc.periodStart,doc.periodEnd);
  const hemat=(parseInt(doc.priceNormal)||0)-(parseInt(doc.pricePromo)||0);
  const priceNormal=parseInt(doc.priceNormal)||0;
  const pricePromo=parseInt(doc.pricePromo)||0;
  const fontFamily=appSettings.fontFamily||'Arial';
  const fontWeight=appSettings.fontWeight||'900';
  
  const w=forPrint?(appSettings.printerWidth||'80mm'):'280px';
  const style=forPrint?`background:white;color:black;padding:16px;font-family:${fontFamily},sans-serif;font-size:12px`:
    `background:white;color:black;padding:16px;font-family:${fontFamily},sans-serif;box-shadow:var(--shadow-md);border-radius:4px`;
  
  let html=`<div style="width:${w};${style}">`;
  
  if(badgeText){
    html+=`<div style="background:#000;color:#fff;padding:8px 12px;text-align:center;font-weight:800;font-size:14px;margin-bottom:12px;letter-spacing:1px">${badgeText}</div>`;
  }
  
  html+=`<div style="font-size:18px;font-weight:${fontWeight};text-align:center;text-transform:uppercase;line-height:1.2;margin:12px 0;color:#000">${doc.productName||'NAMA PRODUK'}</div>`;
  html+=`<div style="text-align:center;color:#000;font-size:14px;margin-bottom:8px;font-weight:600">${doc.productDetail||'Detail'}</div>`;
  
  if(badgeText){
    html+=`<div style="text-align:center;margin:8px 0"><div style="background:#000;color:#fff;padding:6px 12px;display:inline-block;font-weight:700;font-size:12px">${badgeText}</div></div>`;
  }
  
  html+=`<div style="text-align:center;margin:12px 0">`;
  html+=`<span style="font-size:14px;color:#000;text-decoration:line-through;display:block;margin-bottom:4px;font-weight:600">Rp ${priceNormal.toLocaleString('id-ID')}${doc.unit||''}</span>`;
  
  html+=`<div style="display:flex;align-items:baseline;justify-content:center;gap:4px">`;
  html+=`<span style="font-size:32px;font-weight:${fontWeight};line-height:1;color:#000">${pricePromo.toLocaleString('id-ID')}</span>`;
  html+=`<span style="font-size:14px;color:#000;font-weight:600">${doc.unit||''}</span>`;
  html+=`</div></div>`;
  
  html+=`<div style="text-align:center;margin:12px 0">`;
  html+=`<div style="border:2px solid #000;padding:8px 16px;display:inline-block;font-weight:800;font-size:14px;color:#000">HEMAT RP ${hemat.toLocaleString('id-ID')}</div>`;
  html+=`</div>`;
  
  html+=`<div style="border-top:2px dashed #000;margin-top:16px;padding-top:12px;text-align:center;font-weight:700;font-size:12px;color:#000">${period||'PERIODE PROMO'}</div>`;
  
  html+=`</div>`;
  return html;
}

function updatePreview(){

function clearErrors(){
  document.querySelectorAll('.form-control.error').forEach(el=>el.classList.remove('error'));
}

function showError(id,msg){
  const el=document.getElementById(id);
  if(el){
    el.classList.add('error');
    el.scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>el.focus(),300);
  }
  showToast(msg,'error');
  return false;
}

function handleSave(){
  const btn = document.getElementById('btn-save');
  const originalText = btn ? btn.innerHTML : 'SIMPAN KE ANTRIAN';
  
  if(btn) {
    btn.disabled = true;
    btn.style.opacity = '0.7';
    btn.innerHTML = 'Menyimpan...';
  }

  function resetBtn(){
    if(btn){
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.innerHTML = originalText;
    }
  }

  try{
    clearErrors();
    const productName=document.getElementById('f-product')?.value?.trim()||'';
    const productDetail=document.getElementById('f-detail')?.value?.trim()||'';
    const unit=document.getElementById('f-unit')?.value?.trim()||'';
    const priceNormal=document.getElementById('f-price-normal')?.value?.trim()||'';
    const pricePromo=document.getElementById('f-price-promo')?.value?.trim()||'';
    const promoBadge=document.getElementById('f-promo-badge')?.value||'none';
    const customBadge=document.getElementById('f-custom-badge')?.value?.trim()||'';
    const periodStart=document.getElementById('f-period-start')?.value||'';
    const periodEnd=document.getElementById('f-period-end')?.value||'';
    
    if(!productName){ showError('f-product','Nama produk wajib diisi'); resetBtn(); return; }
    if(!productDetail){ showError('f-detail','Detail produk wajib diisi'); resetBtn(); return; }
    if(!unit){ showError('f-unit','Satuan wajib diisi'); resetBtn(); return; }
    if(!priceNormal){ showError('f-price-normal','Harga normal wajib diisi'); resetBtn(); return; }
    if(!pricePromo){ showError('f-price-promo','Harga promo wajib diisi'); resetBtn(); return; }
    if(promoBadge==='custom'&&!customBadge){ showError('f-custom-badge','Judul promo custom wajib diisi'); resetBtn(); return; }
    if(!periodStart){ showError('f-period-start','Tanggal mulai wajib diisi'); resetBtn(); return; }
    if(!periodEnd){ showError('f-period-end','Tanggal selesai wajib diisi'); resetBtn(); return; }
    
    const pn=parseInt(priceNormal);
    const pp=parseInt(pricePromo);
    if(isNaN(pn)||pn<=0){ showError('f-price-normal','Harga normal harus angka valid'); resetBtn(); return; }
    if(isNaN(pp)||pp<=0){ showError('f-price-promo','Harga promo harus angka valid'); resetBtn(); return; }
    if(pp>pn){ showError('f-price-promo','Harga promo tidak boleh lebih besar dari harga normal'); resetBtn(); return; }
    if(periodEnd<periodStart){ showError('f-period-end','Tanggal selesai harus setelah tanggal mulai'); resetBtn(); return; }
    
    currentDoc={productName,productDetail,unit,priceNormal,pricePromo,promoBadge,customBadge,periodStart,periodEnd};
    
    saveToQueue().then(()=>{
      showToast('✓ Promo berhasil disimpan ke antrian');
      navigateTo('queue');
    }).catch(err=>{
      console.error(err);
      showToast('Gagal menyimpan: '+err.message,'error');
    }).finally(resetBtn);
    
  }catch(err){
    console.error(err);
    showToast('Terjadi kesalahan: '+err.message,'error');
    resetBtn();
  }
}

async function saveToQueue(){
  const doc={id:Date.now().toString(),...currentDoc,createdAt:new Date().toISOString(),status:'WAITING'};
  await save('docs',doc);
  await save('queue',{...doc,status:'WAITING'});
}

async function previewDoc(id){
  const doc=await get('queue',id);
  if(!doc)return;
  const html=buildLabelHTML(doc);
  openModal('Preview Promo',`<div class="preview-wrapper">${html}</div>`,null);
}

async function printDoc(id){
  const doc=await get('queue',id);
  if(!doc)return;
  const pa=document.getElementById('print-area');
  pa.innerHTML=buildLabelHTML(doc,true);
  pa.classList.remove('hidden');
  await save('queue',{...doc,status:'PRINTING'});
  renderQueuePage(document.getElementById('main-content'));
  setTimeout(()=>{
    window.print();
    setTimeout(async()=>{
      await save('queue',{...doc,status:'PRINTED'});
      await save('history',{...doc,printDate:new Date().toISOString()});
      pa.classList.add('hidden');
      showToast('✓ Print berhasil');
      renderQueuePage(document.getElementById('main-content'));
    },1000);
  },500);
}

async function delDoc(id){
  openModal('Hapus Promo?','Promo akan dihapus dari antrian.',async()=>{
    await del('queue',id);
    await del('docs',id);
    showToast('Promo dihapus');
    renderQueuePage(document.getElementById('main-content'));
  });
}

          window.location.reload();
        },1500);

    }

}
